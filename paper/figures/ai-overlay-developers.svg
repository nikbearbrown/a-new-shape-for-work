<text x="697" y="477" font-size="16" text-anchor="middle">30%</text>
<line x1="867" x2="867" y1="163" y2="452" stroke="#c6d1d5"/>
<text x="867" y="477" font-size="16" text-anchor="middle">40%</text>
<text x="32" y="196" font-size="20">Understand</text>
<rect x="187" y="174" width="341.02" height="28" fill="#cddde3" stroke="#607884"/>
<rect x="187" y="174" width="228.31" height="28" fill="#13646a"/>
<text x="538.02" y="194" font-size="15">13.4% / 20.1%</text>
<text x="32" y="242" font-size="20">Plan</text>
<rect x="187" y="220" width="144.67" height="28" fill="#cddde3" stroke="#607884"/>
<text x="341.67" y="240" font-size="15">0.0% / 8.5%</text>
