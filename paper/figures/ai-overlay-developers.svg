<text x="32" y="380" font-size="20">Sustain</text>
<rect x="187" y="358" width="191.08" height="28" fill="#cddde3" stroke="#607884"/>
<rect x="187" y="358" width="68.68" height="28" fill="#13646a"/>
<text x="388.08" y="378" font-size="15">4.0% / 11.2%</text>
